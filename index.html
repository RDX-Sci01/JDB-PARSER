<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Explorer</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1020; --panel: #111a2c; --field: #151e32; --line: #293750;
  --text: #e2e8f0; --muted: #8a98b0; --accent: #6366f1; --accent-bg: #4f46e5;
  --hover: #1a2740; --tab-on: #28345a; --code-bg: #0a1120; --code: #a5f3fc;
  --tag-bg: #26345a; --tag: #a5b4fc; --danger: #f87171;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f4f6fb; --panel: #ffffff; --field: #ffffff; --line: #d5dcea;
    --text: #1b2437; --muted: #5d6b85; --accent: #4f46e5; --accent-bg: #4f46e5;
    --hover: #eef1fa; --tab-on: #e3e7fb; --code-bg: #f1f4fa; --code: #0b5a73;
    --tag-bg: #e3e7fb; --tag: #3730a3; --danger: #b91c1c;
  }
}
* { box-sizing: border-box }
body { margin: 0; padding: 22px; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif }
.app { max-width: 1050px; margin: auto }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px }
h1 { font-size: 19px; margin: 0 }
.muted { color: var(--muted); font-size: 11px }

button, input, select { background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; font: inherit }
button { cursor: pointer }
button:hover { border-color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.primary { background: var(--accent-bg); border-color: var(--accent-bg); color: #fff }
.small { padding: 5px 9px; font-size: 11px }
.danger:hover { border-color: var(--danger); color: var(--danger) }

.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap }
.search { flex: 1; min-width: 170px }

#addPanel { display: none; padding: 13px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 12px }
#addPanel.show { display: block }
#addPanel input { width: 100%; margin-bottom: 8px; background: var(--bg) }
.row { display: flex; gap: 7px; flex-wrap: wrap }

.sources { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px }
.tab { white-space: nowrap; color: var(--muted); background: var(--field); border-color: var(--line) }
.tab.active { color: var(--text); background: var(--tab-on); border-color: var(--accent) }

#sourceBar { display: none; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap }
#sourceBar.show { display: flex }
#sourceBar .url { flex: 1; min-width: 0; overflow-wrap: anywhere }
#sourceBar .err { color: var(--danger) }

.stats { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); margin: 12px 2px; font-size: 11px }

.list { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel) }
.item { border-bottom: 1px solid var(--line) }
.item:last-child { border-bottom: 0 }
.item-head { width: 100%; padding: 11px 13px; display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0; border-radius: 0 }
.item-head:hover { background: var(--hover) }
.item-name { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere }
.item-info { color: var(--muted); font-size: 11px; text-align: right }
.tag { background: var(--tag-bg); color: var(--tag); padding: 3px 7px; border-radius: 5px; font-size: 10px; white-space: nowrap }
.body { display: none; border-top: 1px solid var(--line); background: var(--code-bg) }
.item.open .body { display: block }
.body .actions { display: flex; justify-content: flex-end; padding: 8px 12px 0 }
pre { margin: 0; padding: 10px 12px 12px; white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: auto; color: var(--code); font: 11px/1.6 ui-monospace, Menlo, Consolas, monospace }
.empty { padding: 35px 20px; text-align: center; color: var(--muted) }
.empty .err { color: var(--danger) }
.more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; color: var(--muted) }

@media (max-width: 550px) {
  body { padding: 12px }
  header { align-items: flex-start }
  .item-info { display: none }
}
</style>
</head>
<body>
<div class="app">

<header>
  <div>
    <h1>Catalog Explorer</h1>
    <div class="muted">Browse and search JSON catalogs from multiple sources</div>
  </div>
  <button class="primary" id="toggleAdd" aria-expanded="false" aria-controls="addPanel">+ Add source</button>
</header>

<div id="addPanel">
  <input id="sourceName" placeholder="Name (e.g. PFS)" aria-label="Catalog name" autocomplete="off">
  <input id="sourceUrl" type="url" placeholder="https://example.com/catalog.json" aria-label="Catalog URL" autocomplete="off">
  <div class="row">
    <button class="primary" id="addBtn">Add URL</button>
    <button id="fileBtn">Open local file…</button>
    <button id="cancelAdd">Cancel</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>
  <div class="muted" style="margin-top:8px">Remote URLs must allow cross-origin requests (CORS). If one is blocked, download the file and open it locally.</div>
</div>

<div class="toolbar">
  <input class="search" id="search" type="search" placeholder="Search all entries…" aria-label="Search entries">
  <select id="sort" aria-label="Sort entries">
    <option value="name">Name A–Z</option>
    <option value="nameDesc">Name Z–A</option>
    <option value="dateDesc">Newest first</option>
    <option value="dateAsc">Oldest first</option>
  </select>
  <button id="refresh" title="Reload all URL sources" aria-label="Reload all sources">↻</button>
</div>

<div class="sources" id="tabs" role="group" aria-label="Sources"></div>
<div id="sourceBar"></div>

<div class="stats">
  <span id="entryCount" aria-live="polite">0 entries</span>
  <span id="status">Ready</span>
</div>

<div class="list" id="list"></div>

</div>

<script>
"use strict";

const STORE_KEY = "catalog-explorer:sources:v1";
const PAGE_SIZE = 100;
const TIMEOUT_MS = 15000;
const NAME_KEYS = ["name", "title", "label", "id", "slug"];
const DATE_KEYS = ["created_at", "updated_at", "date", "timestamp"];
const LIST_KEYS = ["items", "entries", "catalog", "results", "data"];
const DEFAULT_SOURCES = [{ name: "PFS", url: "https://pegasus-dl.dev/catalogs/pfs.json" }];

const $ = id => document.getElementById(id);
const state = { sources: [], active: "all", open: new Set(), limit: PAGE_SIZE, query: "", sort: "name" };
let nextId = 1;

/* ---------- persistence (URL sources only) ---------- */
function loadSaved() {
  try {
    const list = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (Array.isArray(list)) return list.filter(s => s && typeof s.url === "string" && s.url);
  } catch {}
  return null;
}
function save() {
  try {
    const urls = state.sources.filter(s => s.url).map(({ name, url }) => ({ name, url }));
    localStorage.setItem(STORE_KEY, JSON.stringify(urls));
  } catch {}
}

/* ---------- data helpers ---------- */
function makeSource(props) {
  return { id: String(nextId++), name: "", url: null, data: null, entries: [], error: null, loading: false, loaded: null, ctrl: null, ...props };
}

function normalize(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data === "object") {
    for (const k of LIST_KEYS) if (Array.isArray(data[k])) return data[k];
    return Object.entries(data).map(([k, v]) =>
      v && typeof v === "object" && !Array.isArray(v) ? { id: k, ...v } : { id: k, value: v });
  }
  return data == null ? [] : [data];
}

function getName(item, i) {
  if (item === null || typeof item !== "object") return String(item);
  for (const k of NAME_KEYS) if (item[k] != null && typeof item[k] !== "object") return String(item[k]);
  return "Entry " + (i + 1);
}

function getDate(item) {
  if (!item || typeof item !== "object") return null;
  for (const k of DATE_KEYS) {
    if (item[k] == null) continue;
    const t = new Date(item[k]).getTime();
    if (!Number.isNaN(t)) return t;
  }
  return null;
}

function safeStringify(v, indent) {
  try { return JSON.stringify(v, null, indent) ?? String(v); } catch { return String(v); }
}

// Built once per load, so searching and sorting never re-stringify entries.
function buildEntries(source) {
  source.entries = normalize(source.data).map((item, i) => {
    const name = getName(item, i);
    return {
      key: source.id + ":" + i,
      item, name,
      source: source.name,
      sourceId: source.id,
      date: getDate(item),
      hay: (name + " " + source.name + " " + safeStringify(item)).toLowerCase()
    };
  });
}

/* ---------- loading ---------- */
async function loadSource(source) {
  if (!source.url) return;
  source.ctrl?.abort();
  const ctrl = source.ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort("timeout"), TIMEOUT_MS);
  source.loading = true;
  source.error = null;
  renderAll();

  try {
    const res = await fetch(source.url, { signal: ctrl.signal, headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    source.data = await res.json();
    buildEntries(source);
    source.loaded = new Date();
  } catch (e) {
    if (source.ctrl !== ctrl) return; // superseded by a newer request
    source.data = null;
    source.entries = [];
    source.error =
      ctrl.signal.reason === "timeout" ? "Request timed out" :
      e instanceof SyntaxError ? "Response is not valid JSON" :
      e instanceof TypeError ? "Network error or blocked by CORS" :
      e.message;
  } finally {
    clearTimeout(timer);
    if (source.ctrl === ctrl) { source.loading = false; source.ctrl = null; renderAll(); }
  }
}

function addUrlSource(name, url) {
  let parsed;
  try { parsed = new URL(url); } catch { return alert("Enter a valid URL."); }
  if (!/^https?:$/.test(parsed.protocol)) return alert("Only http and https URLs are supported.");
  if (state.sources.some(s => s.url === url)) return alert("This URL is already added.");
  const source = makeSource({ name: name || parsed.hostname, url });
  state.sources.push(source);
  state.active = source.id;
  save();
  loadSource(source);
}

async function addLocalFile(file) {
  const source = makeSource({ name: file.name.replace(/\.json$/i, "") });
  try {
    source.data = JSON.parse(await file.text());
    buildEntries(source);
    source.loaded = new Date();
  } catch {
    source.error = "File is not valid JSON";
  }
  state.sources.push(source);
  state.active = source.id;
  renderAll();
}

function removeSource(id) {
  const s = state.sources.find(x => x.id === id);
  s?.ctrl?.abort();
  state.sources = state.sources.filter(x => x.id !== id);
  if (state.active === id) state.active = "all";
  save();
  renderAll();
}

/* ---------- rendering ---------- */
function renderTabs() {
  const box = $("tabs");
  box.replaceChildren();
  const make = (label, id) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (state.active === id ? " active" : "");
    b.textContent = label;
    b.dataset.tab = id;
    b.setAttribute("aria-pressed", String(state.active === id));
    return b;
  };
  box.append(make("All", "all"));
  for (const s of state.sources) {
    box.append(make(s.name + (s.loading ? " …" : s.error ? " !" : ""), s.id));
  }
}

function renderSourceBar() {
  const bar = $("sourceBar");
  const s = state.sources.find(x => x.id === state.active);
  bar.classList.toggle("show", !!s);
  bar.replaceChildren();
  if (!s) return;

  const info = document.createElement("div");
  info.className = "muted url";
  info.textContent = (s.url || "Local file") +
    (s.loaded ? " · loaded " + s.loaded.toLocaleTimeString() : "");
  if (s.error) {
    const err = document.createElement("div");
    err.className = "err";
    err.textContent = s.error;
    info.append(err);
  }
  bar.append(info);

  if (s.url) {
    const reload = document.createElement("button");
    reload.className = "small";
    reload.dataset.action = "reload";
    reload.textContent = "Reload";
    bar.append(reload);
  }
  const rm = document.createElement("button");
  rm.className = "small danger";
  rm.dataset.action = "remove";
  rm.textContent = "Remove";
  bar.append(rm);
}

function visibleEntries() {
  const q = state.query.trim().toLowerCase();
  const out = [];
  for (const s of state.sources) {
    if (state.active !== "all" && state.active !== s.id) continue;
    for (const e of s.entries) if (!q || e.hay.includes(q)) out.push(e);
  }

  const cmp = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
  const byDate = dir => (a, b) => {
    if (a.date === null && b.date === null) return cmp(a, b);
    if (a.date === null) return 1;          // undated entries always sort last
    if (b.date === null) return -1;
    return dir * (a.date - b.date) || cmp(a, b);
  };
  const sorters = { name: cmp, nameDesc: (a, b) => cmp(b, a), dateDesc: byDate(-1), dateAsc: byDate(1) };
  return out.sort(sorters[state.sort]);
}

function renderList() {
  const data = visibleEntries();
  const list = $("list");
  list.replaceChildren();

  $("entryCount").textContent = data.length + (data.length === 1 ? " entry" : " entries");
  const loading = state.sources.filter(s => s.loading).length;
  const failed = state.sources.filter(s => s.error).length;
  $("status").textContent = state.sources.length + (state.sources.length === 1 ? " source" : " sources") +
    (loading ? " · loading " + loading : "") + (failed ? " · " + failed + " failed" : "");

  if (!data.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    const active = state.sources.filter(s => state.active === "all" || s.id === state.active);
    if (!state.sources.length) empty.textContent = "No sources yet. Choose “Add source” to load a catalog.";
    else if (active.some(s => s.loading)) empty.textContent = "Loading catalogs…";
    else if (active.length && active.every(s => s.error)) {
      empty.textContent = "Couldn’t load " + (active.length > 1 ? "these catalogs" : active[0].name) + ". ";
      const hint = document.createElement("div");
      hint.className = "err";
      hint.textContent = active.map(s => s.error).filter((v, i, a) => a.indexOf(v) === i).join("; ");
      empty.append(hint, "Check the URL, or open the file locally instead.");
    } else empty.textContent = state.query ? "No entries match your search." : "This catalog is empty.";
    list.append(empty);
    return;
  }

  const frag = document.createDocumentFragment();
  for (const e of data.slice(0, state.limit)) {
    const open = state.open.has(e.key);
    const item = document.createElement("div");
    item.className = "item" + (open ? " open" : "");
    item.dataset.key = e.key;

    const head = document.createElement("button");
    head.type = "button";
    head.className = "item-head";
    head.setAttribute("aria-expanded", String(open));

    const name = document.createElement("span");
    name.className = "item-name";
    name.textContent = e.name;

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = Array.isArray(e.item) ? "array" : e.item === null ? "null" : typeof e.item === "object" ? "object" : typeof e.item;

    const info = document.createElement("span");
    info.className = "item-info";
    info.textContent = e.source;

    head.append(name, tag, info);

    const body = document.createElement("div");
    body.className = "body";
    item.append(head, body);
    if (open) fillBody(item, e);
    frag.append(item);
  }
  list.append(frag);

  if (data.length > state.limit) {
    const more = document.createElement("button");
    more.className = "more";
    more.dataset.action = "more";
    more.textContent = "Show " + Math.min(PAGE_SIZE, data.length - state.limit) + " more (" + (data.length - state.limit) + " hidden)";
    list.append(more);
  }
}

// Pretty-printed JSON is built only when an entry is first opened.
function fillBody(itemEl, entry) {
  const body = itemEl.querySelector(".body");
  if (body.firstChild) return;
  const actions = document.createElement("div");
  actions.className = "actions";
  const copy = document.createElement("button");
  copy.className = "small";
  copy.dataset.action = "copy";
  copy.textContent = "Copy JSON";
  actions.append(copy);
  const pre = document.createElement("pre");
  pre.textContent = safeStringify(entry.item, 2);
  body.append(actions, pre);
}

function renderAll() { renderTabs(); renderSourceBar(); renderList(); }

/* ---------- events ---------- */
function findEntry(key) {
  const id = key.split(":")[0];
  return state.sources.find(s => s.id === id)?.entries[Number(key.split(":")[1])];
}

$("list").addEventListener("click", async ev => {
  const actionEl = ev.target.closest("[data-action]");
  if (actionEl?.dataset.action === "more") { state.limit += PAGE_SIZE; return renderList(); }

  const itemEl = ev.target.closest(".item");
  if (!itemEl) return;
  const entry = findEntry(itemEl.dataset.key);

  if (actionEl?.dataset.action === "copy" && entry) {
    try {
      await navigator.clipboard.writeText(safeStringify(entry.item, 2));
      actionEl.textContent = "Copied";
    } catch { actionEl.textContent = "Copy failed"; }
    setTimeout(() => { actionEl.textContent = "Copy JSON"; }, 1500);
    return;
  }

  if (ev.target.closest(".item-head") && entry) {
    const open = itemEl.classList.toggle("open");
    itemEl.querySelector(".item-head").setAttribute("aria-expanded", String(open));
    open ? state.open.add(entry.key) : state.open.delete(entry.key);
    if (open) fillBody(itemEl, entry);
  }
});

$("tabs").addEventListener("click", ev => {
  const tab = ev.target.closest("[data-tab]");
  if (!tab) return;
  state.active = tab.dataset.tab;
  state.limit = PAGE_SIZE;
  renderAll();
});

$("sourceBar").addEventListener("click", ev => {
  const action = ev.target.closest("[data-action]")?.dataset.action;
  const s = state.sources.find(x => x.id === state.active);
  if (!s) return;
  if (action === "reload") loadSource(s);
  if (action === "remove" && confirm("Remove “" + s.name + "”?")) removeSource(s.id);
});

let searchTimer;
$("search").addEventListener("input", ev => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.query = ev.target.value; state.limit = PAGE_SIZE; renderList(); }, 150);
});
$("sort").addEventListener("change", ev => { state.sort = ev.target.value; renderList(); });
$("refresh").addEventListener("click", () => state.sources.forEach(loadSource));

function setPanel(show) {
  $("addPanel").classList.toggle("show", show);
  $("toggleAdd").setAttribute("aria-expanded", String(show));
  if (show) $("sourceUrl").focus();
}
$("toggleAdd").addEventListener("click", () => setPanel(!$("addPanel").classList.contains("show")));
$("cancelAdd").addEventListener("click", () => setPanel(false));

function submitUrl() {
  const url = $("sourceUrl").value.trim();
  if (!url) return alert("Enter a JSON URL.");
  addUrlSource($("sourceName").value.trim(), url);
  if (state.sources.some(s => s.url === url)) {
    $("sourceName").value = $("sourceUrl").value = "";
    setPanel(false);
  }
}
$("addBtn").addEventListener("click", submitUrl);
$("addPanel").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.tagName === "INPUT" && ev.target.type !== "file") submitUrl();
  if (ev.key === "Escape") setPanel(false);
});

$("fileBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", async ev => {
  for (const file of ev.target.files) await addLocalFile(file);
  ev.target.value = "";
  setPanel(false);
});

/* ---------- init ---------- */
(saved => {
  for (const s of saved || DEFAULT_SOURCES) state.sources.push(makeSource({ name: s.name || new URL(s.url).hostname, url: s.url }));
  renderAll();
  state.sources.forEach(loadSource);
})(loadSaved());
</script>
</body>
</html>
